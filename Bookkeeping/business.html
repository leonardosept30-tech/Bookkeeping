<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ledgerly – Business Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f7fb; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 32px; padding: 32px; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { background: #f8fafc; border-radius: 20px; padding: 16px; flex:1; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eef2f6; }
        input, select, button { padding: 8px 12px; border-radius: 40px; border: 1px solid #cbd5e1; margin-right: 8px; }
        button { background: #0f172a; color: white; border: none; cursor: pointer; }
        .add-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <a href="dashboard.html" style="text-decoration: none;">← Back to Dashboard</a>
    <h1 id="businessName">Loading...</h1>
    <div class="stats" id="stats"></div>
    <div class="add-form">
        <input type="date" id="txDate">
        <input type="text" id="txDesc" placeholder="Description">
        <input type="number" id="txAmount" placeholder="Amount (+ income, - expense)">
        <select id="txType"><option value="income">Income</option><option value="expense">Expense</option></select>
        <button id="addTxBtn">Add Transaction</button>
    </div>
    <table id="txTable">
        <thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead>
        <tbody></tbody>
    </table>
</div>
<script>
    const SUPABASE_URL = 'https://kvygamtieuvhkqjhdhlt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7GFIXIi_gyNVDBB8CpTwSg_v9qg5uIL';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const urlParams = new URLSearchParams(window.location.search);
    const businessId = urlParams.get('business_id');
    let currentUser = null;

    async function init() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { window.location.href = 'dashboard.html'; return; }
    // Check if user is admin
    const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', user.id).single();
    const isAdmin = profile?.is_admin === true;
    if (!isAdmin) {
        // Regular user: must own the business
        const { data: biz, error } = await supabase.from('businesses').select('name').eq('id', businessId).eq('owner_user_id', user.id).single();
        if (error || !biz) { alert("Access denied"); window.location.href = 'dashboard.html'; return; }
        document.getElementById('businessName').innerText = biz.name;
    } else {
        // Admin: just fetch business name (no ownership check)
        const { data: biz } = await supabase.from('businesses').select('name').eq('id', businessId).single();
        if (biz) document.getElementById('businessName').innerText = biz.name + " (Admin View)";
        else window.location.href = 'dashboard.html';
    }
    loadTransactions();
}
    async function loadTransactions() {
        const { data, error } = await supabase.from('transactions').select('*').eq('business_id', businessId).order('date', { ascending: false });
        if (error) { console.error(error); return; }
        const income = data.filter(t => t.type === 'income').reduce((s,t)=>s+t.amount,0);
        const expense = data.filter(t => t.type === 'expense').reduce((s,t)=>s+Math.abs(t.amount),0);
        const profit = income - expense;
        document.getElementById('stats').innerHTML = `
            <div class="stat-card"><strong>Revenue</strong><br>$${income.toLocaleString()}</div>
            <div class="stat-card"><strong>Expenses</strong><br>$${expense.toLocaleString()}</div>
            <div class="stat-card"><strong>Net Profit</strong><br>$${profit.toLocaleString()}</div>
        `;
        const tbody = document.querySelector('#txTable tbody');
        tbody.innerHTML = data.map(t => `
            <tr>
                <td>${t.date}</td>
                <td>${t.description}</td>
                <td style="color:${t.amount>0?'#10b981':'#ef4444'}">$${Math.abs(t.amount)}</td>
            </tr>
        `).join('');
    }
    document.getElementById('addTxBtn').onclick = async () => {
        const date = document.getElementById('txDate').value;
        const desc = document.getElementById('txDesc').value;
        let amount = parseFloat(document.getElementById('txAmount').value);
        const type = document.getElementById('txType').value;
        if (!date || !desc || isNaN(amount)) return alert("Fill all fields");
        amount = type === 'expense' ? -Math.abs(amount) : Math.abs(amount);
        const { error } = await supabase.from('transactions').insert([{ business_id: businessId, date, description: desc, amount, type }]);
        if (error) alert(error.message);
        else loadTransactions();
    };
    init();
</script>
</body>
</html>
